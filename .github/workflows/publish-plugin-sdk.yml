# Publishes the versioned process-plugin packages for independent plugin repositories.
name: Publish plugin SDK

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # TODO(FocusRGB/FocusRGB#79): replace this disabled publisher; the organization token gets
    # HTTP 403 when writing to the MAJ224-owned feed.
    if: ${{ false }}
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRgb.slnx
      - name: Pack contracts and SDK
        shell: pwsh
        run: |
          dotnet pack src/FocusRgb.Contracts/FocusRgb.Contracts.csproj -c Release --no-restore -o build/packages
          dotnet pack src/FocusRgb.PluginSdk/FocusRgb.PluginSdk.csproj -c Release --no-restore -o build/packages
      - name: Publish packages
        shell: pwsh
        run: |
          Get-ChildItem build/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --source "https://nuget.pkg.github.com/MAJ224/index.json" `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Package publication failed for $($_.Name)." }
          }
