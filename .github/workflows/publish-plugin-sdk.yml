# Publishes the versioned process-plugin packages for independent plugin repositories.
name: Publish plugin SDK

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRgb.slnx
      - name: Pack contracts and SDK
        shell: pwsh
        run: |
          dotnet pack src/FocusRgb.Contracts/FocusRgb.Contracts.csproj -c Release --no-restore -o build/packages
          dotnet pack src/FocusRgb.PluginSdk/FocusRgb.PluginSdk.csproj -c Release --no-restore -o build/packages
      - name: Publish packages
        shell: pwsh
        run: |
          dotnet nuget push "build/packages/*.nupkg" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate
