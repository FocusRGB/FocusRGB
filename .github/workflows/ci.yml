# Restores, builds, and tests the solution. The rulesets can require the `build` check.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FocusRGB.slnx
      - name: Build
        run: dotnet build FocusRGB.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution FocusRGB.slnx -c Release --no-build
