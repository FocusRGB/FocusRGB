<head>
  <title>Screen Ambience Desk Off (Pro-required experiment)</title>
  <meta description="Archived experiment: Screen Ambience with a desk mask and per-channel calibration. SignalRGB blocked this video lightscript on WLED without Pro." />
  <meta publisher="rgb-playground" />
  <meta
    property="picture_mode"
    label="Picture Mode"
    type="combobox"
    values="Standard,Cinema,Mono,Vivid,Dominant,HD"
    default="Standard"
  />
  <meta property="blur_amount" label="Blur" type="number" min="0" max="20" default="4" />
  <meta property="motion_smoothing" label="Motion Smoothing" type="number" min="0" max="100" default="50" />
  <meta property="boost" label="Color Shift" type="number" min="-180" max="180" default="0" />
  <meta property="brightness" label="Brightness" type="number" min="-100" max="100" default="0" />
  <meta property="saturation" label="Saturation" type="number" min="-100" max="100" default="50" />
  <meta property="contrast" label="Contrast" type="number" min="-100" max="100" default="25" />

  <!-- ---- white-balance calibration (per-channel gain %, live) ---- -->
  <meta property="gain_r" label="Calibrate: Red gain %"   type="number" min="0" max="150" default="100" />
  <meta property="gain_g" label="Calibrate: Green gain %" type="number" min="0" max="150" default="92" />
  <meta property="gain_b" label="Calibrate: Blue gain %"  type="number" min="0" max="150" default="75" />

  <!-- ---- desk-off mask (region in canvas %, live) ---- -->
  <meta property="mask_enable" label="Desk Mask: enable" type="boolean" default="1" />
  <meta property="mask_x" label="Desk Mask: left (%)"   type="number" min="0" max="100" default="22" />
  <meta property="mask_y" label="Desk Mask: top (%)"    type="number" min="0" max="100" default="30" />
  <meta property="mask_w" label="Desk Mask: width (%)"  type="number" min="0" max="100" default="56" />
  <meta property="mask_h" label="Desk Mask: height (%)" type="number" min="0" max="100" default="45" />
</head>

<style>
  body { overflow: hidden; }
  .scaled { transform: scale(2); position: absolute; left: 160px; top: 100px; }
</style>

<body style="margin: 0; padding: 0; background: #000">
  <canvas id="canvas" class="hueShift" width="320" height="200"></canvas>
</body>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  let g_DomHue = -1;
  let g_PrevHue = null, g_PrevSat = null, g_PrevLight = null, g_PrevPixels = null;

  function getSmoothingAlpha() {
    if (motion_smoothing <= 0) return 1.0;
    return Math.max(0.05, 1.0 - motion_smoothing / 100.0);
  }

  function lerpHue(prev, next, alpha) {
    let diff = next - prev;
    if (diff > 180) diff -= 360; else if (diff < -180) diff += 360;
    let r = prev + diff * alpha;
    if (r < 0) r += 360; else if (r >= 360) r -= 360;
    return r;
  }

  // CSS filter keeps the artistic controls; per-channel gain is applied in JS (below)
  // because CSS filters can't scale R/G/B independently.
  function updateCanvasFilter() {
    const parts = [
      `hue-rotate(${boost}deg)`,
      `brightness(${100 + brightness}%)`,
      `saturate(${100 + saturation}%)`,
      `contrast(${100 + contrast}%)`,
    ];
    if (blur_amount > 0) parts.push(`blur(${blur_amount}px)`);
    canvas.style.filter = parts.join(" ");
  }
  function onboostChanged()       { updateCanvasFilter(); }
  function onbrightnessChanged()  { updateCanvasFilter(); }
  function onsaturationChanged()  { updateCanvasFilter(); }
  function oncontrastChanged()    { updateCanvasFilter(); }
  function onblur_amountChanged() { updateCanvasFilter(); }

  function onpicture_modeChanged() {
    if (picture_mode === "HD") canvas.parentElement.classList.add("scaled");
    else canvas.parentElement.classList.remove("scaled");
  }

  // ---- per-channel gain helpers ----
  function gR(){ return gain_r / 100; }
  function gG(){ return gain_g / 100; }
  function gB(){ return gain_b / 100; }
  function clamp255(v){ return v < 0 ? 0 : v > 255 ? 255 : v; }

  // hsl (h 0..360, s/l 0..100) -> gain-corrected "rgb(r,g,b)" string
  function hslToRgbGain(h, s, l) {
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60)       { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else              { r = c; g = 0; b = x; }
    r = clamp255((r + m) * 255 * gR());
    g = clamp255((g + m) * 255 * gG());
    b = clamp255((b + m) * 255 * gB());
    return `rgb(${r|0}, ${g|0}, ${b|0})`;
  }

  function drawHD() {
    const src = new Uint8ClampedArray(engine.zone.imagedata);
    const alpha = getSmoothingAlpha();
    const rGain = gR(), gGain = gG(), bGain = gB();
    const applyGain = (arr) => {
      for (let i = 0; i < arr.length; i += 4) {
        arr[i]   = clamp255(arr[i]   * rGain);
        arr[i+1] = clamp255(arr[i+1] * gGain);
        arr[i+2] = clamp255(arr[i+2] * bGain);
      }
    };
    if (alpha >= 1.0 || !g_PrevPixels || g_PrevPixels.length !== src.length) {
      g_PrevPixels = new Float32Array(src.length);
      for (let i = 0; i < src.length; i++) g_PrevPixels[i] = src[i];
      const out = new Uint8ClampedArray(src); applyGain(out);
      ctx.putImageData(new ImageData(out, 160, 100), 0, 0);
      return;
    }
    const out = new Uint8ClampedArray(src.length);
    const inv = 1.0 - alpha;
    for (let i = 0; i < src.length; i++) {
      const blended = alpha * src[i] + inv * g_PrevPixels[i];
      g_PrevPixels[i] = blended; out[i] = blended;
    }
    applyGain(out);
    ctx.putImageData(new ImageData(out, 160, 100), 0, 0);
  }

  function drawST() {
    const lightness = new Int8Array(engine.zone.lightness);
    const sat = new Int8Array(engine.zone.saturation);
    const zhue = new Int16Array(engine.zone.hue);

    const alpha = getSmoothingAlpha();
    const inv = 1.0 - alpha;
    const bSmooth = alpha < 1.0;

    if (!g_PrevHue || g_PrevHue.length !== 560) {
      g_PrevHue = new Float32Array(560); g_PrevSat = new Float32Array(560); g_PrevLight = new Float32Array(560);
      for (let i = 0; i < 560; i++) { g_PrevHue[i] = zhue[i]; g_PrevSat[i] = sat[i]; g_PrevLight[i] = lightness[i]; }
    }

    const bMono = picture_mode === "Mono";
    const bVivid = picture_mode === "Vivid";
    const bCinema = picture_mode === "Cinema";
    const bDominant = picture_mode === "Dominant";

    if (bDominant) {
      let iDomZone = 0, iDomSat = 0;
      for (let z = 0; z < 560; z++) if (lightness[z] > 30 && sat[z] > iDomSat) { iDomSat = iDomSat; iDomZone = z; }
      if (g_DomHue == -1) g_DomHue = zhue[iDomZone];
      else if (zhue[iDomZone] > g_DomHue) g_DomHue += 1;
      else if (zhue[iDomZone] < g_DomHue) g_DomHue -= 1;
    }

    for (let iZone = 0; iZone < 560; iZone++) {
      const iRow = Math.floor(iZone / 28), iCol = iZone % 28;
      const iWidth = canvasWidth / 28, iHeight = canvasHeight / 20;
      const zx = iCol * iWidth, zy = iRow * iHeight;

      let hue = zhue[iZone], xSat = sat[iZone], xLight = lightness[iZone];
      if (bSmooth) {
        hue = lerpHue(g_PrevHue[iZone], hue, alpha);
        xSat = alpha * xSat + inv * g_PrevSat[iZone];
        xLight = alpha * xLight + inv * g_PrevLight[iZone];
      }
      g_PrevHue[iZone] = hue; g_PrevSat[iZone] = xSat; g_PrevLight[iZone] = xLight;

      if (bMono)          ctx.fillStyle = hslToRgbGain(hue, 0, xLight);
      else if (bVivid)    ctx.fillStyle = hslToRgbGain(hue, xSat + 10, xLight);
      else if (bCinema)   ctx.fillStyle = hslToRgbGain(hue, xSat - 10, xLight);
      else if (bDominant) ctx.fillStyle = hslToRgbGain(g_DomHue, xSat, xLight);
      else                ctx.fillStyle = hslToRgbGain(hue, xSat, xLight);

      ctx.fillRect(zx, zy, iWidth, iHeight);
    }
  }

  function maskDesk() {
    if (!mask_enable) return;
    ctx.fillStyle = "#000";
    ctx.fillRect((mask_x/100)*canvasWidth, (mask_y/100)*canvasHeight,
                 (mask_w/100)*canvasWidth, (mask_h/100)*canvasHeight);
  }

  function update() {
    if (picture_mode === "HD") drawHD(); else drawST();
    maskDesk();
    window.requestAnimationFrame(update);
  }
  window.requestAnimationFrame(update);
</script>
